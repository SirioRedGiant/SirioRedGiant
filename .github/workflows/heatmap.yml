name: Generate Contribution Heatmap

on:
  schedule:
  # Esegue ogni giorno a mezzanotte UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Permette di avviarlo manualmente
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v4 per evitare il warning di Node.js
      - name: Checkout Repository
        uses: actions/checkout@v4

      # v5 per evitare il warning di Node.js
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Heatmap
        run: python scripts/generate_heatmap.py

      # Usiamo la v5 per evitare il warning di Node.js
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update contribution heatmap"
          file_pattern: contrib-heatmap.svg
