name: Generate Contribution Heatmap

on:
  schedule:
  # Esegue ogni giorno a mezzanotte UTC
    - cron: "0 0 * * *" 
  workflow_dispatch: # Permette di avviarlo manualmente dal tab "Actions"
  push:
    branches:
      - main # O 'master' se il tuo branch principale si chiama così

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Heatmap
        run: python scripts/generate_heatmap.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update contribution heatmap"
          file_pattern: contrib-heatmap.svg
